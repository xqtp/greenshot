message_filenamepattern=Kaydedilen görüntülerin dosya adlarını, aşağıdaki yer tutucuları kullanarak istediğiniz gibi özelleştirebilirsiniz:\n    ${YYYY} yıl, 4 hane\n    ${MM} ay, 2 hane\n    ${DD} gün, 2 hane\n    ${hh} saat, 2 hane\n    ${mm} dakika, 2 hane\n    ${ss} saniye, 2 hane\n    ${NUM} artan sayı, varsayılan olarak 6 hane\n    ${NUM:p-2,0} artan sayı, başında sıfırla 2 hane (01, 02, 03)\n    ${RRR...} rastgele harf ve rakamlar, 'R'lerle aynı uzunlukta\n    ${title} Pencere başlığı\n    ${user} Windows kullanıcısı\n    ${domain} Windows alan adı\n    ${hostname} Bilgisayar adı\n\n    ${NUM} sayacını sıfırlamak için değerini Gelişmiş ayarlardan değiştirin.\n\n    Greenshot ile dinamik klasör oluşturabilirsiniz. Klasör ve dosya adını ayırmak için ters eğik çizgi (\\) kullanın.\n    Örnek: ${YYYY}-${MM}-${DD}\\${hh}-${mm}-${ss} kalıbı, varsayılan kayıt konumuna o günün tarihine göre klasör oluşturur, örneğin 2008-06-29. Ekran görüntüsü dosyası, saate göre adlandırılır, örneğin 11_58_32 (dosya uzantısı ise ayarlara göre eklenir).

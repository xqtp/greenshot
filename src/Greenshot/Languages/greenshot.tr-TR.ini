thanks=Greenshot'ı yüklediğiniz için teşekkürler! Greenshot şu anda çalışıyor ve bildirim alanında, saatin yanında sizi bekliyor.
tip1=Yakalama sırasında Boşluk tuşuna basarak bölge seçme ile pencere yakalama arasında geçiş yapabilirsiniz.
tip2=Yakalama sırasında ok tuşları imleci bir piksel hareket ettirir, Ctrl ile on piksel.
tip3=Yakalama sırasında Z tuşuna basarak büyüteci gösterebilir veya gizleyebilirsiniz; piksel hassasiyetinde seçim için ideal.
tip4=Yakalama sırasında M tuşuna basarak fare imlecini ekran görüntüsünde gösterebilir veya gizleyebilirsiniz.
tip5=Yakalama sırasında F1 tuşuna basarak kullanabileceğiniz tüm tuşları görebilirsiniz.
tip6=Fikrinizi mi değiştirdiniz? Esc, yakalamayı iptal eder.
tip7=Editör, ekran görüntüsünde başkalarının görmemesi gereken kısımları pikselleştirebilir veya bulanıklaştırabilir.
tip8=Bir işlemi adım adım anlatıyorsanız, editördeki sayaç aracıyla adımları numaralandırın.
tip9=Ayarlardan, kaydedilen ekran görüntülerinin klasörünü ve dosya adı kalıbını seçebilirsiniz.
tip10=Greenshot ücretsiz ve açık kaynaklıdır, gönüllüler tarafından geliştirilir. Size yardımcı oluyorsa arkadaşlarınıza da önerin.
tip_next=Başka bir ipucu
tip_notification=Greenshot bildirimini yanlışlıkla mı kapattınız? Bildirim, Windows bildirim merkezinde bekler; üzerine tıklayarak yakalamanın nereye gideceğini Greenshot kapatılmış olsa bile yeniden seçebilirsiniz.
